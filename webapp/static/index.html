<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求职 Agent</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --ink:#1c2430; --dim:#68727f;
    --accent:#2b6cb0; --accent-soft:#ebf3fb; --ok:#2f855a; --warn:#b7791f; --bad:#c53030;
    --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
         display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:17px;font-weight:650}
  header .sp{flex:1}
  .badge{background:var(--accent-soft);color:var(--accent);border-radius:99px;
         padding:3px 11px;font-size:12px;font-weight:600}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:20px;
        max-width:1500px;margin:20px auto;padding:0 20px;align-items:start}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.4px;
           color:var(--dim);text-transform:uppercase}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;
                  padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:132px;resize:vertical;font-size:13px}
  .hint{font-size:12px;color:var(--dim);margin-top:5px}
  .checks{display:flex;flex-direction:column;gap:7px;margin-top:14px;font-size:13.5px}
  .checks label{display:flex;align-items:center;gap:8px;margin:0;font-weight:500}
  input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
  button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:8px;
         background:var(--accent);color:#fff;font:inherit;font-weight:650;cursor:pointer}
  button:disabled{background:#b6c2cf;cursor:not-allowed}
  .log{font:12px/1.7 var(--mono);background:#fbfcfd;border:1px solid var(--line);
       border-radius:7px;padding:10px;max-height:210px;overflow:auto;
       white-space:pre-wrap;color:var(--dim)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;
      padding:4px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border:0}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{font-weight:600;text-align:right}
  .score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .score .num{font-size:48px;font-weight:750;line-height:1}
  .score .num small{font-size:16px;color:var(--dim);font-weight:500}
  .verdict{font-size:19px;font-weight:700}
  .bar{height:11px;background:#e8ecf1;border-radius:99px;overflow:hidden;
       flex:1;min-width:170px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#4299e1,#2b6cb0)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
        vertical-align:top}
  th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  td.n{font-family:var(--mono);font-weight:700;white-space:nowrap}
  ul.tight{margin:0;padding-left:19px}
  ul.tight li{margin-bottom:5px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .gap{border-left:3px solid var(--warn);background:#fffaf0;border-radius:0 7px 7px 0;
       padding:9px 12px;margin-bottom:9px;font-size:13.5px}
  .gap b{color:var(--bad)}
  .art{display:flex;align-items:center;gap:11px;padding:9px 0;
       border-bottom:1px solid var(--line)}
  .art:last-child{border:0}
  .art a{color:var(--accent);font-weight:600;text-decoration:none}
  .art a:hover{text-decoration:underline}
  .art .sz{margin-left:auto;color:var(--dim);font-size:12px;font-family:var(--mono)}
  details{margin-top:12px;border:1px solid var(--line);border-radius:8px}
  summary{cursor:pointer;padding:10px 13px;font-weight:650;font-size:13.5px;
          background:#fbfcfd;border-radius:8px}
  details[open] summary{border-bottom:1px solid var(--line);border-radius:8px 8px 0 0}
  .md{padding:4px 16px 16px;font-size:14px}
  .md h1{font-size:19px}.md h2{font-size:16px;margin-top:20px;
        border-bottom:1px solid var(--line);padding-bottom:5px}
  .md h3{font-size:14.5px;margin-top:16px}
  .md table{font-size:13px}
  .md code{background:#f0f2f5;padding:1px 5px;border-radius:4px;font-family:var(--mono)}
  .empty{color:var(--dim);text-align:center;padding:60px 20px}
  .err{background:#fff5f5;border:1px solid #fed7d7;color:var(--bad);
       border-radius:8px;padding:12px;font-size:13.5px;white-space:pre-wrap}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #cbd5e0;
        border-top-color:var(--accent);border-radius:50%;
        animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>🎯 求职 Agent</h1>
  <span class="badge" id="model-badge">…</span>
  <div class="sp"></div>
  <span class="hint" id="elapsed"></span>
</header>

<div class="wrap">
  <!-- ============ 左栏 ============ -->
  <div>
    <div class="card">
      <h2>① 你的底稿</h2>
      <div id="profile"><div class="empty" style="padding:14px 0">读取中…</div></div>
    </div>

    <div class="card">
      <h2>② 目标 JD</h2>
      <label for="jd-select">从 data/jds 选择</label>
      <select id="jd-select"><option value="">— 载入中 —</option></select>

      <label for="jd-text">或直接粘贴 JD 原文</label>
      <textarea id="jd-text"
        placeholder="把招聘 JD 整段粘贴进来。填了这里就忽略上面的下拉框。"></textarea>
      <div class="hint">粘贴的内容优先于下拉选择</div>

      <div class="checks">
        <label><input type="checkbox" id="opt-cover"> 同时生成求职信</label>
        <label><input type="checkbox" id="opt-interview"> 同时生成面试预测题</label>
        <label><input type="checkbox" id="opt-refresh"> 强制重新分析（忽略缓存，会消耗 token）</label>
      </div>

      <button id="run-btn" onclick="startRun()">开始分析</button>
      <div class="hint" id="cost-hint">
        完整流程约 1~3 分钟、2 万 token 左右。命中缓存时几乎不消耗。
      </div>
    </div>

    <div class="card">
      <h2>③ 进度</h2>
      <div class="log" id="log">等待开始…</div>
    </div>
  </div>

  <!-- ============ 右栏 ============ -->
  <div>
    <div id="result">
      <div class="card empty">
        选一份 JD，点「开始分析」。<br>
        会给出匹配度评分、优势与短板，并生成针对这份 JD 的定制简历。
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => Math.round((v || 0) * 100) + '%';
const kb = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';

let timer = null;

/* ---------- 初始化 ---------- */
async function boot() {
  try {
    const h = await (await fetch('/api/health')).json();
    $('model-badge').textContent = '模型 ' + h.default_model;
  } catch { $('model-badge').textContent = '服务未就绪'; }

  try {
    const { jds } = await (await fetch('/api/jds')).json();
    const sel = $('jd-select');
    sel.innerHTML = jds.length
      ? jds.map(j => `<option value="${esc(j.name)}">${esc(j.title)}（${esc(j.name)}）</option>`).join('')
      : '<option value="">data/jds 里还没有 JD 文件</option>';
  } catch { $('jd-select').innerHTML = '<option value="">读取失败</option>'; }

  try {
    const p = await (await fetch('/api/profile')).json();
    $('profile').innerHTML = p.exists ? `
      <div class="kv"><span>姓名</span><span>${esc(p.name || '（未解析）')}</span></div>
      <div class="kv"><span>底稿字数</span><span>${p.chars}</span></div>
      <div class="kv"><span>技能 / 项目</span><span>${p.skills} / ${p.projects}</span></div>
      <div class="kv"><span>工作 / 校园经历</span><span>${p.experiences} / ${p.campus}</span></div>
      <div class="hint">${p.cached ? '已解析并缓存' : '尚未解析，首次运行时会自动解析'}</div>`
      : `<div class="err">找不到 data/master_profile.md，请先填好简历底稿。</div>`;
  } catch { $('profile').innerHTML = '<div class="err">读取底稿状态失败</div>'; }
}

/* ---------- 提交作业 ---------- */
async function startRun() {
  const text = $('jd-text').value.trim();
  const name = $('jd-select').value;
  if (!text && !name) { alert('请选择一份 JD，或把 JD 原文粘贴进来'); return; }

  $('run-btn').disabled = true;
  $('log').textContent = '正在提交…';
  $('result').innerHTML = '<div class="card empty"><span class="spin"></span> 分析中，请稍候…</div>';

  let jobId;
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jd_name: text ? null : name,
        jd_text: text || null,
        with_cover_letter: $('opt-cover').checked,
        with_interview: $('opt-interview').checked,
        refresh: $('opt-refresh').checked,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
    jobId = data.job_id;
  } catch (e) {
    $('log').textContent = '提交失败：' + e.message;
    $('result').innerHTML = `<div class="card"><div class="err">提交失败：${esc(e.message)}</div></div>`;
    $('run-btn').disabled = false;
    return;
  }
  poll(jobId);
}

/* ---------- 轮询进度 ---------- */
async function poll(jobId) {
  const t0 = Date.now();
  clearInterval(timer);
  timer = setInterval(() => {
    $('elapsed').textContent = '已用 ' + Math.round((Date.now() - t0) / 1000) + ' 秒';
  }, 500);

  while (true) {
    let job;
    try {
      const res = await fetch('/api/jobs/' + jobId);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      job = await res.json();
    } catch (e) {
      $('log').textContent = '轮询失败：' + e.message;
      break;
    }

    $('log').textContent = (job.steps || []).join('\n') || '启动中…';
    $('log').scrollTop = $('log').scrollHeight;

    if (job.status === 'done') {
      clearInterval(timer);
      $('elapsed').textContent = '耗时 ' + job.elapsed + ' 秒';
      render(job.result);
      $('run-btn').disabled = false;
      return;
    }
    if (job.status === 'error') {
      clearInterval(timer);
      $('log').textContent += '\n\n失败：' + job.error;
      $('result').innerHTML =
        `<div class="card"><h2>出错了</h2><div class="err">${esc(job.error)}</div></div>`;
      $('run-btn').disabled = false;
      return;
    }
    await new Promise(r => setTimeout(r, 900));
  }
  clearInterval(timer);
  $('run-btn').disabled = false;
}

/* ---------- 渲染结果 ---------- */
function render(r) {
  if (!r) return;
  const dims = (r.dimensions || []).map(d => `
    <tr><td>${esc(d.dimension)}</td>
        <td class="n">${d.score}</td>
        <td>${esc(d.comment)}</td></tr>`).join('');

  const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join('');
  const gaps = (r.gaps || []).map(g => `
    <div class="gap"><b>${esc(g.skill)}</b>
      —— JD 要求 ${esc(g.required_level)}，你的水平 ${esc(g.candidate_level)}
      ${g.suggestion ? `<div class="hint">${esc(g.suggestion)}</div>` : ''}</div>`).join('');

  const arts = (r.artifacts || []).map(a => `
    <div class="art"><a href="${esc(a.url)}" ${a.ext === 'docx' ? 'download' : 'target="_blank"'}>
      ${a.ext === 'docx' ? '📄' : '📝'} ${esc(a.name)}</a>
      <span class="sz">${kb(a.size)}</span></div>`).join('');

  $('result').innerHTML = `
    <div class="card">
      <h2>匹配度 · ${esc(r.jd.title)}</h2>
      <div class="score">
        <div class="num">${r.score}<small> / 100</small></div>
        <div class="verdict" style="color:${r.score >= 70 ? 'var(--ok)' : r.score >= 55 ? 'var(--warn)' : 'var(--bad)'}">
          ${esc(r.verdict)}</div>
        <div class="bar"><i style="width:${r.score}%"></i></div>
      </div>
      <div class="kv" style="margin-top:14px"><span>公司 / 职级</span>
        <span>${esc(r.jd.company)} / ${esc(r.jd.seniority)}</span></div>
      <div class="kv"><span>命中 / 缺口</span>
        <span>${r.matched_count} 项 / ${r.gap_count} 项</span></div>
      <div class="kv"><span>关键词覆盖率</span><span>${pct(r.keyword_coverage)}</span></div>
    </div>

    <div class="card">
      <h2>六维评分</h2>
      <table><thead><tr><th>维度</th><th>得分</th><th>说明</th></tr></thead>
      <tbody>${dims}</tbody></table>
    </div>

    <div class="cols">
      <div class="card"><h2>你的优势</h2><ul class="tight">${li(r.strengths)}</ul></div>
      <div class="card"><h2>你的短板</h2><ul class="tight">${li(r.weaknesses)}</ul></div>
    </div>

    ${gaps ? `<div class="card"><h2>待补足的差距</h2>${gaps}</div>` : ''}

    <div class="card">
      <h2>产出文件</h2>
      ${arts || '<div class="hint">没有生成文件</div>'}
    </div>

    <div class="card">
      <h2>完整内容</h2>
      <details open><summary>📊 匹配度分析报告</summary>
        <div class="md">${r.match_html}</div></details>
      ${r.resume_html ? `<details><summary>📄 定制简历</summary>
        <div class="md">${r.resume_html}</div></details>` : ''}
    </div>`;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

boot();
</script>
</body>
</html>
